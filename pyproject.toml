[project]
name = "easy-cfd"
version = "0.1.0"
description = "A local OpenFOAM wind tunnel for comparing car designs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "numpy>=2,<3",
    "trimesh>=4.6,<5",
    "scipy>=1.15,<2",
    "vtk>=9.4,<10",
    "cadquery-ocp>=7.8,<8",
    "psutil>=6,<8",
    "networkx>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11",
    "scikit-image>=0.26.0",
    "fast-simplification>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/easycfd"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
