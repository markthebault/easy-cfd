name: Docker backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - backend/**
      - scripts/test-docker-backend.py
      - .github/workflows/docker-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: markthebault/easy-cfd-backend

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: easycfd-backend:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
      - name: Check first-use download, API authentication and restart
        run: python3 scripts/test-docker-backend.py easycfd-backend:test --expect-download
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested architecture
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${REVISION}-${ARCH}"
          docker tag easycfd-backend:test "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest##*@sha256:}"
      - name: Upload published digest
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-platform tags
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: backend-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish latest, main and commit tags
        working-directory: /tmp/digests
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          images=()
          for digest in *; do images+=("${IMAGE}@sha256:${digest}"); done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" --tag "${IMAGE}:main" --tag "${IMAGE}:sha-${REVISION}" \
            "${images[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${REVISION}"
