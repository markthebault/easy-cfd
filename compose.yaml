services:
  backend:
    build: .
    image: easycfd-backend:local
    init: true
    ports:
      - "${EASYCFD_PORT:-8000}:8000"
    environment:
      EASYCFD_REMOTE: "true"
      EASYCFD_API_TOKEN: "${EASYCFD_API_TOKEN:-}"
      EASYCFD_CORS_ORIGINS: "${EASYCFD_CORS_ORIGINS:-*}"
      EASYCFD_PUBLIC_URL: "${EASYCFD_PUBLIC_URL:-http://localhost:${EASYCFD_PORT:-8000}}"
      EASYCFD_DATA: /data
      EASYCFD_PROCESSES: "${EASYCFD_PROCESSES:-4}"
    volumes:
      - "${EASYCFD_DATA_DIR:-./.easycfd-remote}:/data"
    stop_grace_period: 30s
